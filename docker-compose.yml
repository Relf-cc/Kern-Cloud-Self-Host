# Kern, self-hosted: PostgreSQL and the API.
#
#   cp .env.example .env        # fill in the secrets it asks for
#   docker compose up -d --build
#   docker compose logs api     # the bootstrap management token, once
#
# The API is published on 127.0.0.1 only. That is the whole shape of this
# deployment: Kern Platform and kernctl manage it over loopback, and if you
# want people on other machines to sync to it, you put a Cloudflare Tunnel or a
# reverse proxy with TLS in front (see docs/SELF-HOSTING.md) rather than opening
# this port. Whatever you put in front must refuse /kern/v1/admin/* itself:
# requests arrive here through Docker's port proxy, so the server cannot tell a
# forwarded one from a local one.
name: kern

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kern
      POSTGRES_USER: kern
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kern -d kern"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        VERSION: ${KERN_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://kern:${POSTGRES_PASSWORD}@db:5432/kern
      PORT: "8787"
      ADMIN_TOKEN_FILE: /var/lib/kern/admin-token
    volumes:
      # The bootstrap management token, so it survives a rebuild and kernctl
      # on the host can read it.
      - ./data/kern:/var/lib/kern
    ports:
      # Loopback only. Change this to a reverse proxy, not to 0.0.0.0.
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy

  # A Cloudflare Tunnel, so the server can be reached without opening a port.
  # Off by default, because the ordinary shape here is loopback plus whatever
  # you already run in front. Turn it on for a home server with no public
  # address:
  #
  #   CLOUDFLARE_TUNNEL_TOKEN=... in .env
  #   docker compose --profile tunnel up -d
  #
  # Reaching the API from in here is `http://api:8787` - the service name on
  # this network - not 127.0.0.1, which inside the connector's container is
  # the connector itself. Point the tunnel's routes at `api:8787`.
  #
  # The API's loopback publish above stays either way: kernctl and Kern
  # Platform manage the server over it, and the tunnel does not carry the
  # management API (see docs/SELF-HOSTING.md - the ingress rules refuse it,
  # and they have to, because cloudflared's requests arrive looking local).
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Not `:?` - compose interpolates every service before it applies
      # profiles, so a required variable here would stop `docker compose up`
      # for everybody who isn't using the tunnel. Empty, cloudflared says so
      # itself, and only when the profile is actually on.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - api
