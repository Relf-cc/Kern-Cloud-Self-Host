<!--
  Kern Platform's mark: Kern's K, standing on a base.

  The tile, the greys and the K are Kern's own, so the two apps read as a set
  on a dock or a taskbar. The K is set a little smaller and a bar runs under
  it - the platform it manages. Flat fills, no filters: this is drawn at 32px
  more often than at 1024.

  scripts/icons.py renders this to the PNG, ICO and ICNS files Tauri bundles.
-->
